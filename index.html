<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Mus Royale</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #f4f1ea; }
        #paypal-button-container { width: 100%; max-width: 350px; }
    </style>
</head>
<body>
    <h2>Dirua sartu Mus Royale-n</h2>
    <div id="paypal-button-container"></div>

    <script src="https://www.paypal.com/sdk/js?client-id=TU_CLIENT_ID_LIVE&currency=EUR"></script>

    <script>
        // Obtenemos los datos de la URL (amount y userId)
        const urlParams = new URLSearchParams(window.location.search);
        const amount = urlParams.get('amount') || '1.00';
        const userId = urlParams.get('userId');

        paypal.Buttons({
            style: { layout: 'vertical', color: 'gold', shape: 'rect', label: 'paypal' },
            createOrder: function(data, actions) {
                return actions.order.create({
                    purchase_units: [{
                        amount: { value: amount }
                    }]
                });
            },
            onApprove: function(data, actions) {
                return actions.order.capture().then(function(details) {
                    // Redirigimos de vuelta a la App con el esquema musroyale://
                    window.location.href = `musroyale://pago_exitoso?monto=${amount}`;
                });
            },
            onCancel: function (data) {
                window.location.href = "musroyale://pago_cancelado";
            },
            onError: function (err) {
                alert("PayPal Error: " + err);
            }
        }).render('#paypal-button-container');
    </script>
</body>
</html>
