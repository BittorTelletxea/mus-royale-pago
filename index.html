<!DOCTYPE html>
<html lang="eu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mus Royale - Pagoa</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f4f1ea; }
        h2 { color: #333; margin-bottom: 20px; }
        #paypal-button-container { width: 100%; max-width: 350px; padding: 20px; }
    </style>
</head>
<body>
    <h2>Dirua sartu Mus Royale-n</h2>
    <div id="paypal-button-container"></div>

    <script src="https://www.paypal.com/sdk/js?client-id=AcvN8ZTMYytQ4krA2Y3tWKQ1OdpTba2CwxV2QKLo-7XpQJVyvI-Hwoih_GFu9gA1PaIE5MAs9N49UhUI&currency=EUR"></script>
    
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const amount = urlParams.get('amount') || '5.00';

        paypal.Buttons({
            createOrder: function(data, actions) {
                return actions.order.create({
                    purchase_units: [{ amount: { value: amount } }]
                });
            },
            onApprove: function(data, actions) {
                return actions.order.capture().then(function(details) {
                    // Volver a la app con éxito
                    window.location.href = "musroyale://pago_exitoso?id=" + details.id + "&monto=" + amount;
                });
            },
            onCancel: function (data) {
                // Volver a la app si el usuario cancela
                window.location.href = "musroyale://pago_cancelado";
            }
        }).render('#paypal-button-container');
    </script>
</body>
</html>
