<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Mus Royale</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #f4f1ea; margin: 0; }
        #paypal-button-container { width: 90%; max-width: 350px; }
        h2 { color: #333; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h2>Dirua sartu Mus Royale-n</h2>
    <div id="paypal-button-container"></div>

    <script src="https://www.paypal.com/sdk/js?client-id=Afo565SKCJOYlU0YarCWGUPPh1ab3cqmp8LPd9jH-H785oP-0ggscFps1_MDyZShMIYLhfZKc-2o_TJy&currency=EUR"></script>

    <script>
        // 1. Obtener el monto de la URL que envía la App
        const urlParams = new URLSearchParams(window.location.search);
        let amount = urlParams.get('amount') || '1.00';

        // 2. Renderizar los botones de PayPal
        paypal.Buttons({
            style: { layout: 'vertical', color: 'gold', shape: 'rect', label: 'paypal' },
            
            // AQUÍ VA EL BLOQUE QUE PREGUNTASTE:
            createOrder: function(data, actions) {
                // Limpiamos el número por si acaso y forzamos 2 decimales
                const formattedAmount = parseFloat(amount).toFixed(2);
                
                console.log("Enviando monto a PayPal:", formattedAmount);

                return actions.order.create({
                    purchase_units: [{
                        amount: {
                            currency_code: 'EUR',
                            value: formattedAmount
                        }
                    }]
                });
            },

            onApprove: function(data, actions) {
                return actions.order.capture().then(function(details) {
                    // Si el pago es exitoso, volvemos a la App
                    window.location.href = `musroyale://pago_exitoso?monto=${amount}`;
                });
            },

            onCancel: function (data) {
                window.location.href = "musroyale://pago_cancelado";
            },

            onError: function (err) {
                // Esto te mostrará el error en una ventana emergente si algo falla
                alert("PayPal Error: " + err);
                console.error("Error detallado:", err);
            }
        }).render('#paypal-button-container');
    </script>
</body>
</html>
